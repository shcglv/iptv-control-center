name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        # conftest.py sets the required IPTV_* environment for the test database.
        run: pytest -q

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: src/iptvcc/static
          retention-days: 7

  docker:
    name: Image build + smoke test
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: iptv-control-center:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/iptv-data
          chmod 777 /tmp/iptv-data
          docker run -d --name iptv-ci -p 8000:8000 \
            -e IPTV_APP_ENV=test \
            -e IPTV_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e IPTV_DATABASE_URL="sqlite+aiosqlite:////data/iptv.db" \
            -e IPTV_PUBLIC_BASE_URL="http://127.0.0.1:8000" \
            -e IPTV_SCHEDULER_ENABLED=false \
            -e IPTV_TELEGRAM_ENABLED=false \
            -v /tmp/iptv-data:/data \
            iptv-control-center:ci

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::the API did not become healthy"
            docker logs iptv-ci
            exit 1
          fi

          # The UI is served by the same container.
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'
          # The admin CLI works against the migrated database.
          docker exec iptv-ci python -m iptvcc.cli create-admin \
            --email ci@test.local --password correct-horse-battery >/dev/null
          # The process does not run as root.
          test "$(docker exec iptv-ci id -u)" = "10001"

      - name: Logs
        if: failure()
        run: docker logs iptv-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f iptv-ci || true
