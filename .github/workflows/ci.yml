name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        # conftest.py sets the required IPTV_* environment for the test database.
        run: pytest -q

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: src/iptvcc/static
          retention-days: 7

  docker:
    name: Image build + acceptance
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: iptv-control-center:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Acceptance against the built image
        env:
          IPTV_CONTAINER_TESTS: "1"
          IPTV_TEST_IMAGE: iptv-control-center:ci
          IPTV_TEST_IMAGE_SKIP_BUILD: "1"
        run: pytest tests/test_container.py -q

      - name: Container logs
        if: failure()
        run: docker logs iptv-acceptance || true

      - name: Cleanup
        if: always()
        run: docker rm -f iptv-acceptance || true
