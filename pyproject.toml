[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iptv-control-center"
version = "0.2.0"
description = "Self-hosted IPTV control plane: sources, catalog, EPG, quality, devices. Video never transits the server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "shcgl" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # httpx is a runtime dependency: netguard, the Telegram client and discovery use it.
  "httpx>=0.27",
  "cryptography>=43",
  "argon2-cffi>=23",
  "pyotp>=2.9",
  "lxml>=5.0",
  "tzdata>=2024.1",
  "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iptvcc = ["py.typed", "static/index.html", "static/assets/*", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: needs Chromium; set IPTV_BROWSER_TESTS=1 to run"]
filterwarnings = ["error::DeprecationWarning:iptvcc.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic migrations are generated; formatting them to our style obscures the diff.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PT", "RUF"]
# The product UI is Russian: Cyrillic characters that resemble Latin ones are expected.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Long playlist/EPG fixture strings must stay on one line to match real provider data.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["iptvcc"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
